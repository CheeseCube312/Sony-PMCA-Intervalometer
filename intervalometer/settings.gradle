pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // PREFER_PROJECT: the legacy framework/stubs modules declare their own repositories
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'Intervalometer'

include ':app'
// OpenMemories-Framework (framework + stubs) is vendored under third_party/,
// patched for Gradle 8.9 / JDK 17 - a fresh clone builds as-is. No AndroidX.
include ':framework'
project(':framework').projectDir = file('third_party/OpenMemories-Framework/framework')
include ':stubs'
project(':stubs').projectDir = file('third_party/OpenMemories-Framework/stubs')